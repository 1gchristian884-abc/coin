    /* Estilos del Menú MIDASO y Tareas Avanzadas */
    .vych-dashboard{padding:22px;display:grid;gap:16px}
    .vych-chart-card{padding:18px;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
    .chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .chart-header h3{font-size:12px;margin:0;color:var(--gold);font-weight:800}
    .chart-visual{width:100%;height:110px;display:flex;align-items:flex-end;gap:6px;padding-top:10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
    .chart-bar{flex:1;background:linear-gradient(180deg,var(--green),rgba(70,216,155,0.1));border-radius:4px 4px 0 0;transition:height .3s ease}
    .airdrop-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    .airdrop-tile{background:var(--surface3);border:1px solid var(--line);padding:14px;border-radius:10px}
    .airdrop-tile span{font-size:9px;color:var(--muted);display:block}
    .airdrop-tile strong{font-family:var(--mono);font-size:17px;color:var(--gold);display:block;margin-top:5px;font-weight:700}

    .midaso-task-box{background:linear-gradient(145deg,#131a22,#0d121b);border:1px solid var(--gold-border);border-radius:14px;padding:18px;margin-bottom:16px}
    .midaso-task-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--gold);margin-bottom:8px}
    .midaso-task-step{font-size:9.5px;color:var(--muted);line-height:1.6;margin-bottom:6px}
    .midaso-action-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
    .reward-pill{font-family:var(--mono);font-size:11px;color:var(--gold);background:rgba(226,189,114,0.1);border:1px solid var(--gold-border);padding:5px 10px;border-radius:8px;font-weight:700}

    /* Tarjetas de Maratón de Anuncios y Servidores Temporales */
    .ad-marathon-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
    .marathon-card{background:linear-gradient(145deg,#17211b,#0e1411);border:1px solid #32644a;border-radius:12px;padding:16px}
    .marathon-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .marathon-head h3{margin:0;font-size:11.5px;color:var(--green);font-weight:800}
    .marathon-track{width:100%;height:6px;background:#1d2b23;border-radius:99px;overflow:hidden;margin:10px 0}
    .marathon-fill{height:100%;background:var(--green);border-radius:99px}
    .marathon-meta{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:10px}

    .manage-actions{display:grid;gap:8px;margin-top:14px}
    .manage-tile{display:flex;flex-direction:column;align-items:flex-start;padding:13px 15px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;width:100%;text-align:left;position:relative;transition:border-color .15s}
    .manage-tile:hover{border-color:var(--gold)}
    .manage-tile strong{font-size:11px;color:var(--text);display:block;font-weight:700}
    .manage-tile span{font-size:9px;color:var(--muted);display:block;margin-top:3px}
    .tile-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--gold)}

    .automation-card{padding:16px}
    .auto-track{width:100%;height:6px;background:#27313b;border-radius:99px;overflow:hidden;margin:10px 0 6px}
    .auto-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:99px}
    .auto-meta{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--muted);margin-bottom:8px}

    .progress-section{padding:18px;margin-top:13px}
    .progress-line{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--muted);margin-top:10px;margin-bottom:4px}
    .progress-line strong{font-family:var(--mono);color:var(--gold);font-weight:600}
    .progress-track{width:100%;height:7px;background:#28313b;border-radius:99px;overflow:hidden;margin-bottom:6px}
    .global-fill{height:100%;background:linear-gradient(90deg,#30835d,var(--gold));border-radius:99px}
    .personal-fill{height:100%;background:linear-gradient(90deg,#4285f3,#6ab7ff);border-radius:99px}
    .progress-foot{font-size:9px;color:var(--muted);margin-top:10px;line-height:1.5}

    .manage-menu{padding:18px;margin-top:12px;background:linear-gradient(145deg,#111722,#0d121b);border:1px solid var(--gold-border);border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,0.6)}

    .manage-menu-head h2{font-size:13px;margin:0;color:var(--gold);font-weight:800}
    .manage-menu-head p{font-size:9px;color:var(--muted);margin:4px 0 0}
    .menu-close{background:none;border:0;color:var(--gold);font-size:12px;font-weight:700;padding:2px 6px}
    
    .server-hardware-grid{display:grid;grid-template-columns:1fr;gap:12px}

        const data = await response.json();

      '<div class="airdrop-stats-grid"><article class="card airdrop-tile"><span>'+t("airdropBalanceLabel")+'</span><strong data-testid="value-airdrop-balance">'+fmt(state.balance)+' $MIDASO</strong></article><article class="card airdrop-tile"><span>'+t("estimatedTgeValue")+'</span><strong style="color:var(--green)">$'+fmt(estTgeUsd)+' USDT</strong></article></div>'+
      '<article class="card" style="padding:18px"><h3 style="font-size:12px;color:var(--gold);margin:0 0 8px">Round 1 Snapshot</h3><p style="font-size:9.5px;color:var(--muted);line-height:1.6;margin:0">Round 1 has ended · what comes next is announced soon. Keep participating in AdsGram tasks and partner bots to secure your allocation.</p></article></div></section>';
    }

    function render(){
      updateEnergy();applyLanguageShell();setupNav();
      const view=document.getElementById("view");
      view.innerHTML=active==="minar"?renderMinar():active==="refs"?renderRefsView():active==="tareas"?renderTasksView():active==="stats"?renderStatsView():renderMidasoView();
      bindActions();
    }
    function earn(amount){
      state.balance+=amount;state.lifetime+=amount;state.today+=amount;save();
    }
    async function doMine(){
      updateEnergy();if(state.energy<10){showToast(t("insufficientEnergy"));return}
      state.energy-=10;state.energyAt=now();const reward=.5*state.multiplier;
      earn(reward);
      const tg = window.Telegram && window.Telegram.WebApp;
      const userName = tg?.initDataUnsafe?.user?.username || tg?.initDataUnsafe?.user?.first_name || "Tú (Pro User)";
      const block={id:"b"+now()+Math.random().toString(16).slice(2,6),level:levelFor(state.balance),multiplier:state.multiplier,server:currentServer(),miner:userName,reward,time:now()};
      state.blocks.unshift(block);state.blocks=state.blocks.slice(0,25);state.blocksTotal=(state.blocksTotal||0)+1;save();render();showToast(t("blockMined",{amount:fmt(reward)}));
    }
    async function buyServer(serverId,days){
      const server=servers.find(s=>s.id===serverId),duration=durations.find(d=>d.days===Number(days));if(!server||!duration)return;
      const index=durations.indexOf(duration),price=server.prices[index],rewardTotal=server.dailyReward*duration.days;
      const replacing=state.autoMine&&state.autoMine.endsAt>now();
      const detail=t("serverDialogBody",{server:serverLabel(server),duration:duration.label,price:fmtInt(price),reward:fmtInt(rewardTotal)})+(replacing?" "+t("replaceRental"):"");
      const ok=await dialog(t("serverDialogTitle"),detail,t("activateDemo"));
      if(!ok)return;
      
      requestTelegramStarsPayment(serverLabel(server) + " (" + duration.label + ")", price, () => {
        updateEnergy();
        const startedAt=now(),endsAt=startedAt+duration.days*86400000;
        state.autoMine={serverId:server.id,serverName:server.name,dailyReward:server.dailyReward,days:duration.days,priceStars:price,rewardTotal,startedAt,endsAt,paid:0,todayPaid:0};
        openPanel=null;save();render();showToast(t("serverActivated",{server:serverLabel(server)}));
      });
    }
    async function buyMultiplier(value){
      if(state.multiplier===value){showToast(t("multiplierAlreadyActive"));return}
      const item=mults.find(m=>m.x===value);if(!item)return;
      const ok=await dialog(t("multiplierDialogTitle"),t("multiplierDialogBody",{value,price:fmtInt(item.stars)}),t("activateMultiplier",{value}));
      if(ok){
        requestTelegramStarsPayment("Multiplier ×" + value, item.stars, () => {
          state.multiplier=value;openPanel=null;save();render();showToast(t("multiplierActivated",{value}));
        });
      }
    }
    async function copyInvite(){
      const tg = window.Telegram && window.Telegram.WebApp;
      const userId = tg?.initDataUnsafe?.user?.id || "92837410";
      const link="https://t.me/vychminer_bot?start=ref_" + userId;
      try{await navigator.clipboard.writeText(link);showToast(t("inviteCopied"));}
      catch(e){const ta=document.createElement("textarea");ta.value=link;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");showToast(t("inviteCopied"))}catch(err){showToast(link)}ta.remove()}
    }
    function shareTelegram(){
      const tg = window.Telegram && window.Telegram.WebApp;
      const userId = tg?.initDataUnsafe?.user?.id || "92837410";
      const link="https://t.me/vychminer_bot?start=ref_" + userId;
      const text = encodeURIComponent("🚀 Únete a VYCH Coin Miner, la plataforma de minería profesional en Telegram. ¡Usa mi enlace y gana recompensas de hardware!");
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${text}`;
      if(tg && tg.openTelegramLink) {
        tg.openTelegramLink(shareUrl);
      } else {
        window.open(shareUrl, '_blank');
      }
    }
    async function claimEnergy(){
      syncDaily();if(state.adEnergyCount>=100){showToast(t("energyAdLimit"));return}
      showToast("Loading ad...");
      await triggerRewardedAd();
      updateEnergy();const gained=300+Math.floor(Math.random()*201);
      state.energy=Math.min(cap(state),state.energy+gained);
      state.energyAt=now();state.adEnergyCount++;save();render();
      showToast(t("energyRewardOutcome",{amount:fmtInt(gained)})+" · "+t("simulateReward"));
    }

    // Acción para Conectar Wallet Tentadora (+10k VYCH de bono)
    async function handleConnectWallet(){
      if(state.walletConnected) return;
      showToast("Connecting TON Wallet...");
      await triggerRewardedAd(); // Genera visualización y monetización al conectar
      state.walletConnected = true;
      earn(10000); // Bono tentador de 10k VYCH
      save();
      render();
      showToast(t("walletConnectedToast"));
    }

    // Funciones del Maratón de Anuncios y Renta de Servidores Temporales
    async function handleWatchMarathonAd(){
      syncDaily();
      showToast("Loading marathon ad...");
      await triggerRewardedAd();
      state.adMarathonCount = (state.adMarathonCount || 0) + 1;
      save();
      render();
      showToast("Ad viewed! Progress: " + state.adMarathonCount + " ads.");
    }

    async function claimServerLease(serverType, durationMinutes, rewardTotal) {
      const nowTime = now();
      const endsAt = nowTime + durationMinutes * 60000;
      state.autoMine = {
        serverId: serverType,
        serverName: serverType.toUpperCase() + " Lease",
        dailyReward: Math.floor(rewardTotal * (1440 / durationMinutes)),
        days: durationMinutes / 1440,
        priceStars: 0,
        rewardTotal: rewardTotal,
        startedAt: nowTime,
        endsAt: endsAt,
        paid: 0,
        todayPaid: 0
      };
      if(serverType === 'atlas') state.atlasClaimed = true;
      if(serverType === 'zenith') state.zenithClaimed = true;
      if(serverType === 'elite') state.eliteClaimed = true;
      save();
      render();
      showToast(t("leaseActiveToast"));
    }

    async function handleOpenDrama(){
      showToast("Opening iLoveDrama partner bot...");
      await triggerRewardedAd();
      const tg = window.Telegram && window.Telegram.WebApp;
      const targetUrl = "https://t.me/ilovedrama_bot";
      if(tg && tg.openTelegramLink) {
        tg.openTelegramLink(targetUrl);
      } else {
        window.open(targetUrl, '_blank');
      }
    }

    async function handleClaimDrama(){
      if(state.dramaCompleted) return;
      state.dramaCompleted = true;
      earn(250);
      save();
      render();
      showToast("Task completed! +250 VYCH credited.");
    }

    async function buyEnergyPack(index){
      updateEnergy();const pack=energyPacks[index];if(!pack)return;
      const newMax=cap(state)+pack.amount;
      const detail=t("energyPurchaseBody",{amount:fmtInt(pack.amount),price:fmtInt(pack.stars),capacity:fmtInt(newMax)});
      const ok=await dialog(t("energyPurchaseTitle"),detail,t("buyDemo")+" · "+fmtInt(pack.stars)+"⭐ Stars");
      if(!ok)return;
      
      requestTelegramStarsPayment("Battery Pack +" + pack.amount, pack.stars, () => {
        updateEnergy();
        state.maxCapacity=newMax;
        state.energy=Math.min(state.maxCapacity,state.energy+pack.amount);
        state.energyAt=now();openPanel=null;save();render();
        showToast(t("energyPurchaseToast",{amount:fmtInt(pack.amount),capacity:fmtInt(newMax)}));
      });
    }
    function weightedPrize(){
      const roll=Math.random()*100;let total=0;
      for(const p of prizes){total+=p.probability;if(roll<total)return p}
      return prizes[0];
    }
    async function spin(isAd){
      syncDaily();if(spinBusy)return;
      if(isAd){
        if(state.adSpinCount>=15){showToast(t("adSpinLimit"));return}
        showToast("Loading ad...");
        await triggerRewardedAd();
        state.adSpinCount++;
      }else{
        if(state.freeSpinUsed){showToast(t("freeSpinUsedToast"));return}
        state.freeSpinUsed=true;
      }
      updateEnergy();
      const prize=weightedPrize(),index=prizes.indexOf(prize);let result;
      if(prize.type==="energy"){
        const amount=prize.min+Math.floor(Math.random()*(prize.max-prize.min+1));
        state.energy=Math.min(cap(state),state.energy+amount);state.energyAt=now();
        result={nameKey:prize.nameKey,type:"energy",awarded:amount,overflow:0,time:now()};
      }else{
        state.balance+=prize.amount;state.lifetime+=prize.amount;state.today+=prize.amount;result={nameKey:prize.nameKey,type:"vych",amount:prize.amount,time:now()};
      }
      const center=prizeCenter(index),target=(360-center+360)%360,previous=Number(state.wheelRotation)||0,previousMod=((previous%360)+360)%360,delta=(target-previousMod+360)%360,endRotation=previous+360*5+delta;
      state.wheelRotation=endRotation;state.lastSpin=result;save();spinBusy=true;
      const freeButton=document.getElementById("spinWheel"),adButton=document.getElementById("adSpin"),wheel=document.getElementById("wheelRing");
      if(freeButton){freeButton.disabled=true;freeButton.textContent=t("spinning")}
      if(adButton)adButton.disabled=true;
      if(wheel){wheel.style.transition="transform 4.8s cubic-bezier(.12,.72,.12,1)";void wheel.offsetWidth;requestAnimationFrame(()=>{wheel.style.transform="rotate("+endRotation+"deg)"})}
      const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      await new Promise(resolve=>setTimeout(resolve,reduced?100:4950));
      spinBusy=false;render();showToast(t("spinResultToast",{prize:t(prize.nameKey),reward:spinRewardText(result)}));
    }
    function bindActions(){
      const language=document.getElementById("languageSelect");
      if(language)language.onchange=()=>{if(SUPPORTED_LANGS.includes(language.value)){state.lang=language.value;save();render()}};
      const mine=document.getElementById("mineBtn");if(mine)mine.onclick=doMine;
      const openServers=document.getElementById("openServers");if(openServers)openServers.onclick=()=>{openPanel=openPanel==="servers"?null:"servers";render()};
      const openMultipliers=document.getElementById("openMultipliers");if(openMultipliers)openMultipliers.onclick=()=>{openPanel=openPanel==="multipliers"?null:"multipliers";render()};
      const openEnergyStore=document.getElementById("openEnergyStore");if(openEnergyStore)openEnergyStore.onclick=()=>{openPanel=openPanel==="energy"?null:"energy";render()};
      document.querySelectorAll("[data-close-menu]").forEach(b=>b.onclick=()=>{openPanel=null;render()});
      document.querySelectorAll("[data-server-id]").forEach(b=>b.onclick=()=>buyServer(b.dataset.serverId,Number(b.dataset.days)));
      document.querySelectorAll("[data-mult]").forEach(b=>b.onclick=()=>buyMultiplier(Number(b.dataset.mult)));
      document.querySelectorAll("[data-energy-pack]").forEach(b=>b.onclick=()=>buyEnergyPack(Number(b.dataset.energyPack)));
      const copy=document.getElementById("copyInvite");if(copy)copy.onclick=copyInvite;
      const shareTg=document.getElementById("shareTelegram");if(shareTg)shareTg.onclick=shareTelegram;
      const energy=document.getElementById("claimEnergy");if(energy)energy.onclick=claimEnergy;
      
      const connectWalletBtn=document.getElementById("connectWalletBtn");if(connectWalletBtn)connectWalletBtn.onclick=handleConnectWallet;
      
      document.querySelectorAll("#watchMarathonAd").forEach(b=>b.onclick=handleWatchMarathonAd);
      const claimAtlas=document.getElementById("claimAtlas");if(claimAtlas)claimAtlas.onclick=()=>claimServerLease("atlas", 20, 6940);
      const claimZenith=document.getElementById("claimZenith");if(claimZenith)claimZenith.onclick=()=>claimServerLease("zenith", 30, 15600);
      const claimElite=document.getElementById("claimElite");if(claimElite)claimElite.onclick=()=>claimServerLease("elite", 60, 41650);

      const openDrama=document.getElementById("openDramaBtn");if(openDrama)openDrama.onclick=handleOpenDrama;
      const claimDrama=document.getElementById("claimDramaBtn");if(claimDrama)claimDrama.onclick=handleClaimDrama;
      const adSpin=document.getElementById("adSpin");if(adSpin)adSpin.onclick=()=>spin(true);
      const wheel=document.getElementById("spinWheel");if(wheel)wheel.onclick=()=>spin(false);
    }
    
    try {
      if(window.Telegram&&window.Telegram.WebApp){
        const tg=window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        if(tg.isVersionAtLeast&&tg.isVersionAtLeast("6.1")){
          if(tg.setHeaderColor)tg.setHeaderColor("#07090c");
          if(tg.setBackgroundColor)tg.setBackgroundColor("#07090c");
        }
      }
    } catch(e) {
      console.warn("Telegram WebApp init notice:", e);
    }
    
    try {
      render();
    } catch(e) {
      console.error("Render critical error:", e);
      document.getElementById("view").innerHTML = '<div style="padding:40px;text-align:center;color:var(--gold)"><h3>Initialization Notice</h3><p>Please reload the mini app.</p></div>';
    }

    setInterval(()=>{
      const dailyReset=updateEnergy();
      if(dailyReset&&active==="tareas"){render();return}
      if(active==="minar"){
        const currentCap=cap(state);
        const el=document.querySelector('[data-testid="value-energy"]');
        if(el){el.innerHTML=fmtInt(state.energy)+' <small>/ '+fmtInt(currentCap)+'</small>';const fill=document.querySelector(".energy-fill");if(fill)fill.style.width=Math.min(100,state.energy/currentCap*100)+"%";const btn=document.getElementById("mineBtn");if(btn)btn.disabled=state.energy<10}
        const balance=document.querySelector('[data-testid="value-balance"]');if(balance)balance.textContent=fmt(state.balance);
        const level=levelFor(state.balance),levelEl=document.querySelector('[data-testid="value-level"]'),levelFill=document.getElementById("levelProgressFill"),nextEl=document.getElementById("nextLevelText");
        if(levelEl)levelEl.textContent=String(level);if(levelFill)levelFill.style.width=levelProgress(state.balance)+"%";
        const levelLabel=document.getElementById("levelLabel");if(levelLabel)levelLabel.textContent=t("level")+" "+level+" "+t("of100");
        [10,50,100].forEach(targetLvl=>{const item=document.getElementById("compact-milestone-"+targetLvl);if(item)item.classList.toggle("done",level>=targetLvl)});
        if(nextEl)nextEl.textContent=level>=100?t("maxLevel"):t("nextLevel",{amount:fmtInt(Math.max(0,levelThresholds[level+1]-state.balance)),level:level+1});
        const job=state.autoMine,activeJob=!!(job&&job.endsAt>now()),progress=job?Math.min(100,Math.max(0,(job.paid||0)/job.rewardTotal*100)):0;
        const autoFill=document.getElementById("autoFill"),autoPaid=document.getElementById("autoPaid"),autoPercent=document.getElementById("autoPercent"),autoLabel=document.getElementById("autoLabel"),autoRemaining=document.getElementById("autoRemaining"),autoStatus=document.getElementById("autoStatus"),server=document.querySelector('[data-testid="value-server"]');
        if(autoFill)autoFill.style.width=progress+"%";if(autoPaid)autoPaid.textContent=fmt(job?job.paid:0)+" / "+fmt(job?job.rewardTotal:0)+" VYCH";if(autoPercent)autoPercent.textContent=activeJob?fmt(progress,1)+"%":t("localProgress");
        if(autoLabel)autoLabel.textContent=activeJob?t("inProgress"):job?t("finished"):t("notActivated");if(autoRemaining)autoRemaining.textContent=activeJob?t("finishesIn",{time:remainingText(job.endsAt-now())}):t("noLease");if(autoStatus)autoStatus.textContent=activeJob?t("serverActiveStatus"):t("serverBaseStatus");if(server&&server.firstChild)server.firstChild.textContent=currentServer();
      }
      if(active==="stats"){
        const today=document.querySelector('[data-testid="value-today-earnings"]');if(today)today.textContent=fmt(state.today);
        const total=document.querySelector('[data-testid="value-lifetime-earnings"]');if(total)total.textContent=fmt(state.lifetime);
        const baseGlobal=214000000, globalMined=baseGlobal+(state.blocksTotal*1450);
        const personal=document.querySelector('[data-testid="value-personal-mining-progress"]');if(personal)personal.textContent=fmt(state.balance)+" / "+fmtInt(MINING_ALLOCATION)+" VYCH · "+fmt(Math.min(100,state.balance/MINING_ALLOCATION*100),4)+"%";
        const personalFill=document.querySelector(".personal-fill");if(personalFill)personalFill.style.width=Math.min(100,state.balance/MINING_ALLOCATION*100)+"%";
        const global=document.querySelector('[data-testid="value-global-mining-progress"]');if(global)global.textContent=fmtInt(globalMined)+" / "+fmtInt(MINING_ALLOCATION)+" VYCH · "+fmt(Math.min(100,globalMined/MINING_ALLOCATION*100),2)+"%";
        const globalFill=document.querySelector(".global-fill");if(globalFill)globalFill.style.width=Math.min(100,globalMined/MINING_ALLOCATION*100)+"%";
      }
    },1000);
    window.addEventListener("storage",e=>{if(e.key===STORAGE_KEY){state=load();render()}});
  })();
  </script>
</body>
</html>
