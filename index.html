    // Función integrada para procesar pagos reales con Telegram Stars vía Render
    async function requestTelegramStarsPayment(title, starsAmount, onSuccessCallback) {
      const tg = window.Telegram && window.Telegram.WebApp;
      const userId = tg?.initDataUnsafe?.user?.id || 12345;
      
      showToast("Generando factura de pago...");
      try {
        const response = await fetch('https://coin-qv1j.onrender.com/create-invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: title, stars: starsAmount, userId: userId })
        });
        const data = await response.json();
        if (data.invoiceLink) {
          if (tg && tg.openInvoice) {
            tg.openInvoice(data.invoiceLink, (status) => {
              if (status === "paid") {
                onSuccessCallback();
              } else {
                showToast("Pago cancelado o no completado.");
              }
            });
          } else {
            window.open(data.invoiceLink, '_blank');
          }
        } else {
          showToast("Error al crear la factura.");
        }
      } catch (err) {
        console.error(err);
        showToast("Error de conexión con el servidor de pagos.");
      }
    }
