<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYCH COIN MINER</title>
    <style>
        :root {
            --bg-dark: #0b0e11;
            --card-bg: #151b22;
            --accent-green: #00ffcc;
            --accent-gold: #f3ba2f;
            --text-main: #ffffff;
            --text-muted: #8b949e;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid #30363d;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #30363d;
            text-align: center;
        }
        h1 { font-size: 22px; color: var(--accent-green); margin-bottom: 5px; }
        p { color: var(--text-muted); font-size: 14px; }
        .btn {
            background: var(--accent-green);
            color: var(--bg-dark);
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Selector de Idioma -->
    <div class="top-bar">
        <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="en">🇬🇧 English</option>
            <option value="es">🇪🇸 Español</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="pt">🇧🇷 Português</option>
        </select>
    </div>

    <div class="container">
        <h1 id="t-title">VYCH COIN MINER</h1>
        <p id="t-subtitle">Production Version - Automine & Roulette Active</p>
        <div style="margin: 20px 0; background: #0b0e11; padding: 15px; border-radius: 8px;">
            <span style="font-size: 24px; font-weight: bold; color: var(--accent-gold);">69.42 $VYCH</span>
            <p id="t-balance" style="margin: 5px 0 0 0;">Accumulated Balance</p>
        </div>
        <p><span id="t-energy-label">Station Energy</span>: <strong>410 / 600</strong> (10 pts/min)</p>
        <button class="btn" id="t-btn" onclick="mineBlock()">MINE BLOCK (+0.5)</button>
    </div>

    <script>
        const translations = {
            en: {
                subtitle: "Production Version - Automine & Roulette Active",
                balance: "Accumulated Balance",
                energyLabel: "Station Energy",
                btnText: "MINE BLOCK (+0.5)",
                alertText: "Block mined! +0.5 $VYCH successfully added."
            },
            es: {
                subtitle: "Versión de Producción - Servidores Automine & Ruleta Activos",
                balance: "Balance Acumulado",
                energyLabel: "Energía de Estación",
                btnText: "MINAR BLOQUE (+0.5)",
                alertText: "¡Bloque minado! +0.5 $VYCH sumados con éxito."
            },
            zh: {
                subtitle: "生产版本 - 自动挖矿和轮盘激活",
                balance: "累计余额",
                energyLabel: "站能量",
                btnText: "开采区块 (+0.5)",
                alertText: "区块开采成功！+0.5 $VYCH 已添加。"
            },
            ru: {
                subtitle: "Производственная версия - Автомайнинг и рулетка активны",
                balance: "Накопленный баланс",
                energyLabel: "Энергия станции",
                btnText: "ДОБЫТЬ БЛОК (+0.5)",
                alertText: "Блок добыт! Успешно добавлено +0.5 $VYCH."
            },
            pt: {
                subtitle: "Versão de Produção - Automine & Roleta Ativos",
                balance: "Saldo Acumulado",
                energyLabel: "Energia da Estação",
                btnText: "MINERAR BLOCO (+0.5)",
                alertText: "Bloco minerado! +0.5 $VYCH adicionados com sucesso."
            }
        };

        function changeLanguage(lang) {
            document.getElementById('t-subtitle').innerText = translations[lang].subtitle;
            document.getElementById('t-balance').innerText = translations[lang].balance;
            document.getElementById('t-energy-label').innerText = translations[lang].energyLabel;
            document.getElementById('t-btn').innerText = translations[lang].btnText;
            
            // Guardar preferencia del usuario
            localStorage.setItem('vych_lang', lang);
        }

        function mineBlock() {
            const lang = document.getElementById('langSelect').value;
            alert(translations[lang].alertText);
        }

        // Cargar idioma guardado o por defecto inglés
        window.onload = function() {
            const savedLang = localStorage.getItem('vych_lang') || 'en';
            document.getElementById('langSelect').value = savedLang;
            changeLanguage(savedLang);
        }
    </script>
</body>
</html>
